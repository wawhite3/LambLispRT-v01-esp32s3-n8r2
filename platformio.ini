[platformio]
default_envs = esp32s3-n8r2
boards_dir = ll_pio/boards
core_dir = ~/.platformio-idf55

; ============================================================================
; PLATFORM PIN -- DO NOT UNPIN, AND DO NOT BUMP WITHOUT RE-MEASURING MEMORY.
;   = Arduino core 3.3.11 = ESP-IDF 5.5.5   (published 2026-07-24)
; A bare `platform = espressif32` FLOATS to whatever happens to be installed, which
; is why this is pinned at all; the pin is a release URL, so it is also the only
; in-tree record of which core this project is built against.
;
; WHY NOT THE OFFICIAL PLATFORM: platform-espressif32 7.0.1 (PlatformIO's current
; official release) still pins framework-arduinoespressif32 ~3.20017.0 = Arduino
; 2.0.17 = ESP-IDF 4.4.7, which went EOL ~mid-2024.  The official platform never
; advanced the core past 2.0.17, so `framework = arduino` there IS a choice to stay
; on an EOL IDF.  pioarduino is the fork that tracks current Arduino/IDF while
; keeping `framework = arduino`.
;
; WHAT THIS MIGRATION IS FOR: IDF 4.4.7 has no esp_mmu_map(), no PSRAM MMU target,
; and its esp_ptr_executable() excludes the whole 0x3D000000 PSRAM window -- so NCG
; code could only ever live in the 32 KB D/IRAM pool.  IDF 5.x has esp_mmu_map() +
; MMU_MEM_CAP_EXEC + MMU_TARGET_PSRAM0 on the S3.  Whether PSRAM can actually back
; an EXECUTABLE mapping is STILL UNVERIFIED: the primitives exist, the capability
; has not been demonstrated.  Do NOT record it as working until a stub has been
; written into PSRAM and successfully called.
;
; RE-MEASURE BEFORE TRUSTING ANY MEMORY CONSTANT.  These were measured against the
; ESP-IDF 4.4.7 layout and are NOT valid here until re-taken:
;   - LL_NCG_EXEC_POOL_BYTES = 32 KB (ll_platform_generic.h), measured twice over
;     on the S3 and the LX6, not guessed;
;   - the B95 internal-DRAM cliff: at a 128 KB pool the N8R2 had 500 bytes of
;     INTERNAL DRAM free after setup, so every 512-byte LittleFS read returned
;     ESP_ERR_NO_MEM (err 257).
; THE SYMPTOM TO RECOGNISE: a layout change does NOT present as an allocation error
; -- it presents as MISSING TEST FILES, because the reads fail, not the allocations.
; ============================================================================
[common]
build_type = release
board_build.variants_dir = ll_pio/variants
board_build.variant = ll_variant-generic
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3

[env:esp32s3-n8r2]
extends = common
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = ll_board-esp32s3-n8r2
board_build.partitions = ll_pio/partitions/partitions_8M_ota.csv
board_build.filesystem = littlefs
board_build.app_partition_name = ota_0
board_upload.offset_address = 0x130000
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    arduino-libraries/ArduinoHttpClient@^0.4.0
    bblanchon/ArduinoJson@^6.19.4
monitor_filters = esp8266_exception_decoder
build_flags =
    -DLL_BOARD_NAME='"esp32s3-n8r2"'
    -Wformat
    -O3
    -DNDEBUG
    -DCONFIG_DISABLE_HAL_LOCKS
    -DETHERNET_SPI_SPEED=26000000
    -DETHERNET_MAX_SOCK_NUM=2
    -DETHERNET_LARGE_BUFFERS
    -DCONFIG_LWIP_IPV6=1
    -DCONFIG_LWIP_IPV6_AUTOCONFIG=1
    -DCONFIG_LWIP_IPV6_NUM_ADDRESSES=3
    -DLL_ESP_ARDUINO=1
    -DLL_COMMONIO=1
    -DLL_I2C=1
    -DLL_LCD1602=1
    -DLL_MODBUS=1
    -DLL_PROFIBUS=1
    -DLL_PCA9685=1
    -DBOARD_HAS_PSRAM
    -DLL_SONAR=1
    -DLL_LITTLEFS=1
    -DLL_WIFI=1
    -DLL_WIRE=1
    -DLL_WS2812=1
    -DLL_BIGNUM=1
    -DLL_RATIONAL=1
    -DLL_COMPLEX=1
    -DLL_ESP32=1
    -DLL_XTENSA=1
    -DLL_ESP32S3=1
    -DLL_ESP32S3_N8R2=1
    -DCONFIG_ESP_INT_WDT_TIMEOUT_MS=300
    ${sysenv.W3_EXTRA_FLAGS}
    -L$PROJECT_DIR
    -llamblisp

; ESP32-S3-EYE: WROOM-1 N8R8 (8MB flash / 8MB OCTAL PSRAM), OV2640 camera. USB: NATIVE USB ONLY, NO UART BRIDGE -> USB-CDC-on-boot.  *** DO NOT USE A ttyACM NUMBER TO REACH THIS BOARD [B501]. *** **MAC 34:85:18:a8:99:7c**, read 2026-09-19 from /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_34:85:18:A8:99:7C-if00 the first time the board enumerated after being absent all day.  That is the identity to resolve by; it had never been recorded, which is why usbmac.py --port-for returned nothing for this env while usbenum could still see the board.  This field used to read '/dev/ttyACM0', and as of 2026-09-19 /dev/ttyACM0 is esp32s3-n32r16-00 -- so anything following that record flashed, pushed settings to, or benchmarked THE WRONG BOARD and filed the result under this env's name.  Node numbers are enumeration order: ttyACM6 was 303a:1001 (JTAG) in the morning of 2026-09-19 and 303a:4001 (CDC) the same afternoon, because flashing MicroPython changed the USB mode.  THIS BOARD HAS NO MAC RECORDED AND IS THE ONLY ONE THAT DOES NOT, which is why `usbmac.py --port-for esp32-s3-eye` returns nothing and every MAC-resolving verb fails on it.  The cause is structural rather than an omission: a 303a:1001 JTAG descriptor advertises the MAC in its serial field (usb-Espressif_USB_JTAG_serial_debug_unit_10:BD:A3:E0:7F:3C-if00), while a 303a:4001 CDC descriptor advertises a DEVICE SERIAL instead (usb-Espressif_Systems_Espressif_Device_28372ff8b1440000-if00), so a MAC-keyed resolver cannot see a CDC-only board at all.  TO FIX: bring the board up, read its by-id serial, and record it HERE as the identity (the CDC serial appears to encode the MAC -- 28372ff8b144 -> 28:37:2f:f8:b1:44 on the n8r2 -- but verify that on THIS board rather than assuming it, because assuming is what would put the wrong board back in the record). P136 Phase 1 = boot to REPL; camera (feature+CAMERA_MODEL_ESP32S3_EYE) added in Phase 2.